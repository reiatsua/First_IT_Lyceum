{% extends 'main/base.html' %}

{% block content %}
    <div class="card shadow-sm p-4 mt-3">
        <h1 class="text-center text-primary mb-4">{{ page.title }}</h1>
        <div class="page-content">
            {% if page.content %}
                {{ page.content|linebreaks }}
            {% else %}
                <p class="text-muted text-center">Раздел находится в разработке...</p>
            {% endif %}
        </div>
    </div>
{% endblock %}
